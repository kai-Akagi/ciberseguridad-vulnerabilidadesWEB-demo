<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal de Clientes - Vulnerable</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:40px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header{
    color:#005a9c;
    border-bottom:1px solid #ddd;
    margin-bottom:20px;
}

.label{
    font-weight:bold;
}

input{
    padding:8px;
    width:200px;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

.warning{
    margin-top:15px;
    color:#c0392b;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="card">

    <div class="header">
        <h2>Portal de Clientes</h2>
    </div>

    <div id="app"></div>

</div>

<script>

const clientes = {

    1001: {
        nombre: "Juan Pérez",
        pedido: "ORD-5487",
        total: "$1,250"
    },

    1002: {
        nombre: "Ana López",
        pedido: "ORD-5488",
        total: "$4,800"
    }

};

const params = new URLSearchParams(window.location.search);
const idSolicitado = params.get("id"); 

const app = document.getElementById("app");

/* =======================
   PANTALLA DE LOGIN
   ======================= */

if (!idSolicitado) {

    app.innerHTML = `
        <h3>Inicio de Sesión</h3>

        <p>
            Usuario de prueba:
        </p>

        <ul>
            <li>1001 = Juan Pérez</li>
            <li>1002 = Ana López</li>
        </ul>

        <input id="userId" placeholder="Ingrese su ID">

        <button onclick="login()">
            Iniciar sesión
        </button>
    `;

}

/* =======================
   PERFIL VULNERABLE
   ======================= */

else {

    const cliente = clientes[idSolicitado]; 

    if(cliente){

        localStorage.setItem("usuarioAutenticado", idSolicitado);

        app.innerHTML = `

            <h3>Sesión activa</h3>

            <p>
                <span class="label">Usuario autenticado:</span>
                ${localStorage.getItem("usuarioAutenticado")}
            </p>

            <hr>

            <p>
                <span class="label">Cliente:</span>
                ${cliente.nombre}
            </p>

            <p>
                <span class="label">Pedido:</span>
                ${cliente.pedido}
            </p>

            <p>
                <span class="label">Total:</span>
                ${cliente.total}
            </p>

        `;
    }
}

function login(){

    const id = document.getElementById("userId").value;

    localStorage.setItem("usuarioAutenticado", id);

    window.location.href = window.location.pathname + "?id=" + id;
}

</script>

</body>
</html>
