<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal de Clientes - Corregido</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:40px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header{
    color:#005a9c;
    border-bottom:1px solid #ddd;
    margin-bottom:20px;
}

.label{
    font-weight:bold;
}

input{
    padding:8px;
    width:200px;
}

button{
    padding:8px 15px;
    cursor:pointer;
    background:#005a9c;
    color:white;
    border:none;
    border-radius:4px;
}

button:hover{
    background:#00467a;
}

.error{
    color:#c0392b;
    font-weight:bold;
}

.success{
    color:#27ae60;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="card">

    <div class="header">
        <h2>Portal de Clientes</h2>
        <p>Sistema de consulta de pedidos</p>
    </div>

    <div id="app"></div>

</div>

<script>

const clientes = {

    1001: {
        nombre: "Juan Pérez",
        pedido: "ORD-5487",
        total: "$1,250"
    },

    1002: {
        nombre: "Ana López",
        pedido: "ORD-5488",
        total: "$4,800"
    }

};

const app = document.getElementById("app");

const params = new URLSearchParams(window.location.search);
const idSolicitado = params.get("id"); 

/* ==========================
   LOGIN
   ========================== */

if (!idSolicitado && !localStorage.getItem("usuarioAutenticado")) {

    app.innerHTML = `
        <h3>Inicio de Sesión</h3>

        <p>Usuarios de prueba:</p>

        <ul>
            <li>1001 = Juan Pérez</li>
            <li>1002 = Ana López</li>
        </ul>

        <input id="userId" placeholder="ID de usuario">

        <button onclick="login()">
            Iniciar sesión
        </button>
    `;
}

else {

    const usuarioAutenticado =
        Number(localStorage.getItem("usuarioAutenticado"));

    const recursoSolicitado =
        Number(idSolicitado);

    /* Validación de autorización */

    if (usuarioAutenticado !== recursoSolicitado) { 

        app.innerHTML = `
            <h2 class="error">
                Error 403 - Acceso denegado
            </h2>

            <p>
                El usuario autenticado no tiene permisos
                para consultar este recurso.
            </p>

            
            <button onclick="cerrarSesion()">
                Cerrar sesión
            </button>
        `;
    }
    else {

        const cliente = clientes[usuarioAutenticado];

        app.innerHTML = `


            <hr>

            <p>
                <span class="label">
                    Cliente:
                </span>
                ${cliente.nombre}
            </p>

            <p>
                <span class="label">
                    Pedido:
                </span>
                ${cliente.pedido}
            </p>

            <p>
                <span class="label">
                    Total:
                </span>
                ${cliente.total}
            </p>

            <button onclick="cerrarSesion()">
                Cerrar sesión
            </button>
        `;
    }
}

function login(){

    const id = document.getElementById("userId").value;

    if(!clientes[id]){
        alert("Usuario no válido");
        return;
    }

    localStorage.setItem(
        "usuarioAutenticado",
        id
    );

    window.location.href =
        window.location.pathname + "?id=" + id;
}

function cerrarSesion(){

    localStorage.removeItem(
        "usuarioAutenticado"
    );

    window.location.href =
        window.location.pathname;
}

</script>

</body>
</html>
